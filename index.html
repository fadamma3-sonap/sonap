<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDlYIfiYF61xJ-BYVG2gFNA70u03R1PiX8",
  authDomain: "sonap-12b72.firebaseapp.com",
  projectId: "sonap-12b72",
  storageBucket: "sonap-12b72.firebasestorage.app",
  messagingSenderId: "668056144776",
  appId: "1:668056144776:web:124e6e7d7e5cb7c103883d"
};
try{
  const app = initializeApp(firebaseConfig);
  const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const noop = ()=>{};
  // Adaptateur : même API que celle utilisée par l'application (collection/doc/set/delete/onSnapshot)
  window.SONAB_DB = {
    collection: c => ({
      doc: id => ({
        set: o => { setDoc(doc(fs,c,id),o).catch(console.error); return Promise.resolve(); },
        delete: () => { deleteDoc(doc(fs,c,id)).catch(console.error); return Promise.resolve(); }
      }),
      onSnapshot: (ok,err) => onSnapshot(collection(fs,c), s=>ok({docs:s.docs.map(d=>({data:()=>d.data()}))}), err||noop)
    }),
    doc: path => { const [c,id]=path.split("/"); return {
      set: o => { setDoc(doc(fs,c,id),o).catch(console.error); return Promise.resolve(); },
      onSnapshot: (ok,err) => onSnapshot(doc(fs,c,id), s=>ok({exists:s.exists(),data:()=>s.data()}), err||noop)
    }; }
  };
}catch(e){ console.error("Firebase indisponible",e); }
window.dispatchEvent(new Event("sonab-db-ready"));
</script>

const COLS = ["factures","recus","contrats","employes","stock","mouvements","depenses","chantiers","taches","commandes","fournisseurs","livraisons"];
const DEP_CATS = [
  ["mainoeuvre","Main-d'œuvre","Ouvriers, tâcherons, équipes payées à la tâche ou à la journée"],

/* ---------- persistance ---------- */
function loadLocal(){
  try{ const raw = localStorage.getItem("sonab-data"); if(raw){ const d=JSON.parse(raw); COLS.forEach(c=>S[c]=d[c]||[]); S.cfg=mergeCfg(d.cfg); } }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem("sonab-data", JSON.stringify(S)); }catch(e){} }

async function put(col, obj){
  const list = S[col]; const i = list.findIndex(x=>x.id===obj.id);
  if(i>=0) list[i]=obj; else list.push(obj);
  if(DB){ await DB.collection(col).doc(obj.id).set(JSON.parse(JSON.stringify(obj))); }
  else saveLocal();
}
async function del(col, id){
  S[col] = S[col].filter(x=>x.id!==id);
  if(DB){ await DB.collection(col).doc(id).delete(); } else saveLocal();
}
async function putCfg(cfg){
  S.cfg = cfg;
  if(DB) await DB.doc("config/entreprise").set(cfg); else saveLocal();
}

async function init(){
  loadLocal(); render();
  try{
    if(window.claude){ DB = await claude.use("db"); }
    else{
      if(!window.SONAB_DB) await new Promise(r=>{ window.addEventListener("sonab-db-ready",r,{once:true}); setTimeout(r,6000); });
      DB = window.SONAB_DB || null;
    }

function totFacture(f){
  const ht = (f.lignes||[]).reduce((s,l)=>s+n(l.qte)*n(l.pu),0);
  const remise = n(f.remise);
  const base = Math.max(0, ht-remise);
  const tva = base*n(f.tva)/100;
  return {ht, remise, base, tva, ttc: base+tva};
}
function paye(f){ return S.recus.filter(r=>r.factureId===f.id).reduce((s,r)=>s+conv(r.montant,dv(r),dv(f)),0); }
function statutFacture(f){
  const t=totFacture(f).ttc, p=paye(f);
  if(t>0 && p>=t-0.5) return ["Payée","t-ok"];
  if(p>0) return ["Partielle","t-warn"];
  if(f.echeance && f.echeance<today()) return ["En retard","t-bad"];
  return ["Impayée","t-mut"];
}
function nextNum(prefix, list){
  const y=new Date().getFullYear(), re=new RegExp("^"+prefix+"-"+y+"-(\\d+)$"); let m=0;
  list.forEach(x=>{ const r=re.exec(x.numero||""); if(r) m=Math.max(m,+r[1]); });
  return `${prefix}-${y}-${String(m+1).padStart(4,"0")}`;
}

const catLabel = k => (DEP_CATS.find(c=>c[0]===k)||[k,k])[1];
const moisLabel = p => p ? new Date(p+"-01T00:00:00").toLocaleDateString(curLoc(),{month:"long",year:"numeric"}) : "";
const sumM = l => l.reduce((s,d)=>s+n(d.montant),0);
const sumB = (l,to) => l.reduce((s,d)=>s+conv(d.montant,dv(d),to||S.cfg.devise),0);
function salairePaye(empId, periode){ return S.depenses.find(d=>d.categorie==="salaire"&&d.typeSalaire!=="avance"&&d.employeId===empId&&d.periode===periode); }

/* coûts d'un chantier : dépenses imputées (hors achats mis en stock) + matériaux sortis du stock vers ce chantier */
function coutChantier(id){
  const dep = sumB(S.depenses.filter(d=>d.chantierId===id && !(d.categorie==="materiel" && d.mouvementId)));
  const mat = S.mouvements.filter(m=>m.chantierId===id && m.type==="sortie").reduce((s,m)=>{ const a=S.stock.find(x=>x.id===m.articleId); return s+n(m.quantite)*n(m.prix ?? (a&&a.prix)); },0);
  return {dep, mat, total:dep+mat};
}

function chantierOpts(cur){
  const list=S.chantiers.filter(c=>c.statut!=="Terminé"||c.id===cur).sort((a,b)=>(a.code||"").localeCompare(b.code||""));

  return o;
}
function coutContrat(c){ return coutChantier(c.id).total + S.chantiers.filter(ch=>ch.contratId===c.id).reduce((s,ch)=>s+coutChantier(ch.id).total,0); }

  const livre=bcs.filter(c=>c.statut==="Livrée").reduce((s,c)=>s+conv(bcTotal(c),dv(c),to),0);

function depObjet(d){
  switch(d.categorie){
    case "mainoeuvre": return (d.objet||"Main-d'œuvre")+(n(d.nbJours)?` (${qty(d.nbJours)} j × ${money(d.tauxJour)})`:"");
    case "materiel": { const nom=d.designation||d.objet||"Matériel"; return n(d.quantite)?`${qty(d.quantite)} ${d.unite||""} ${nom}`.replace(/\s+/g," "):nom; }
    case "salaire": return (d.typeSalaire==="avance"?"Avance sur salaire – ":"Salaire – ")+moisLabel(d.periode);

/* nombre en lettres */
function enLettres(x){
  x=Math.floor(Math.abs(n(x))); if(x===0) return "zéro";
  const u=["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"];
  const d=["","dix","vingt","trente","quarante","cinquante","soixante","soixante","quatre-vingt","quatre-vingt"];
  const c99=v=>{ if(v<20) return u[v]; let t=Math.floor(v/10), r=v%10; if(t===7||t===9) r+=10;
    if(r===0) return t===8?"quatre-vingts":d[t]; if((r===1||r===11)&&t<8) return d[t]+" et "+u[r]; return d[t]+"-"+u[r]; };
  const c999=v=>{ const h=Math.floor(v/100), r=v%100; if(!h) return c99(r); let s=h===1?"cent":u[h]+" cent"; if(!r&&h>1) s+="s"; return r?s+" "+c99(r):s; };
  const parts=[];
  for(const [v,name] of [[1e9,"milliard"],[1e6,"million"],[1e3,"mille"]]){
    const q=Math.floor(x/v); if(q){ if(name==="mille") parts.push(q===1?"mille":c999(q).replace(/(cent|vingt)s$/,"$1")+" mille"); else parts.push(c999(q)+" "+name+(q>1?"s":"")); x%=v; }
  }
  if(x) parts.push(c999(x));
  return parts.join(" ");
}

function montantLettres(v,cur){ cur=cur||CUR||S.cfg.devise; const x=Math.round(Math.abs(n(v))*100)/100, ent=Math.floor(x), cts=Math.round((x-ent)*100);
  return `${enLettres(ent)} ${devLettres(cur)}${cts&&cur!=="GNF"?` et ${enLettres(cts)} centime${cts>1?"s":""}`:""}`; }

    <div class="panel"><h2>À encaisser</h2>${aEnc.length? `<ul class="list">${aEnc.slice(0,6).map(x=>`<li><span>${esc(x.label)}<br><small class="t-mut">${esc(x.client)}, payé ${money(x.paye)} sur ${money(x.total)}</small></span><b>${money(x.total-x.paye)}</b></li>`).join("")}</ul><button class="btn sm" data-go="encaisser" style="margin-top:8px">Voir tout ce qui reste à encaisser</button>` : `<p class="sub">Tout est encaissé.</p>`}</div>

      return l.length? `<ul class="list">${l.slice(0,5).map(x=>`<li><span>${esc(x.f.nom)}</span><b class="t-bad">${money(x.st.credit)}</b></li>`).join("")}<li><span><b>Total dû</b></span><b>${money(tot)}</b></li></ul><button class="btn sm" data-go="fournisseurs" style="margin-top:8px">Voir les fournisseurs</button>` : `<p class="sub">Aucune dette envers les fournisseurs.</p>`; })()}</div>

  const rows=inPeriod.filter(d=>!depCat||d.categorie===depCat).filter(d=>match(d.numero,d.beneficiaire,depObjet(d),catLabel(d.categorie),chantierLabel(d.chantierId),d.reference)).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.numero||"").localeCompare(a.numero||""));
  const newBtn = depCat ? `<button class="btn primary" data-act="depNew" data-id="${depCat}">Nouvelle dépense</button>` : `<button class="btn primary" data-act="newDepense">Nouvelle dépense</button>`;
  return head("Dépenses", `${depMois?moisLabel(depMois):"Toutes les périodes"} · total ${money(sumB(inPeriod))}`, searchBox("Rechercher une dépense")+`<button class="btn" data-act="paySalaires">Payer les salaires</button>`+newBtn) +
  `<div class="filters"><label>Mois<input type="month" id="depMois" value="${depMois}"></label><label>Chantier<select id="depCh">${[["","Tous les chantiers"],...chantierOpts(depChantier).slice(1)].map(([v,l])=>`<option value="${esc(v)}" ${v===depChantier?"selected":""}>${esc(l)}</option>`).join("")}</select></label>${depMois?`<button class="btn sm" data-act="depAll">Toutes les périodes</button>`:`<button class="btn sm" data-act="depThisMonth">Ce mois-ci</button>`}</div>
  <div class="tabs" role="group" aria-label="Catégorie">${[["","Toutes",sumB(inPeriod)],...DEP_CATS.map(([k,l])=>[k,l,sumB(inPeriod.filter(d=>d.categorie===k))])].map(([k,l,t])=>`<button data-act="depCat" data-id="${k}" aria-pressed="${depCat===k}">${l} : ${money(t)}</button>`).join("")}</div>` +
  (rows.length ? `<div class="tablewrap"><table class="wide"><thead><tr><th>Numéro</th><th>Date</th><th>Catégorie</th><th>Payé à</th><th>Objet</th><th>Chantier</th><th>Mode</th><th class="num">Montant</th><th></th></tr></thead><tbody>${
    rows.map(d=>withCur(dv(d),()=>`<tr><td class="nw"><b>${esc(d.numero)}</b></td><td class="nw">${dfr(d.date)}</td><td>${esc(catLabel(d.categorie))}</td><td>${esc(d.beneficiaire)}</td><td>${esc(depObjet(d))}${d.contratId?`<br><small class="t-mut">${esc(contratLabel(d.contratId))}</small>`:""}${d.mouvementId?`<br><small class="t-ok">Ajouté au stock</small>`:""}</td><td>${esc(chantierLabel(d.chantierId))||"—"}</td><td>${esc(d.mode)}</td><td class="num">${money(d.montant)}</td>
    <td class="actions"><button class="btn sm" data-act="viewDepense" data-id="${d.id}">${d.categorie==="salaire"&&d.typeSalaire!=="avance"?"Bulletin":"Voir"}</button> <button class="btn sm" data-act="editDepense" data-id="${d.id}">Modifier</button> <button class="btn sm danger" data-act="delDepense" data-id="${d.id}">Supprimer</button></td></tr>`)).join("")
  }<tr><td colspan="7"><b>Total affiché</b></td><td class="num"><b>${money(sumB(rows))}</b></td><td></td></tr></tbody></table></div>`
  : S.depenses.length ? `<div class="empty">Aucune dépense pour ce filtre.</div>` : emptyState("Aucune dépense enregistrée.","newDepense","Enregistrer une dépense"));
},

  const rows=[...S.livraisons].sort((a,b)=>(b.numero||"").localeCompare(a.numero||"")).filter(l=>match(l.numero,l.client,l.adresse,chantierLabel(l.chantierId),l.statut,l.transporteur));

    rows.map(l=>{ const f=S.factures.find(x=>x.id===l.factureId); const nb=(l.lignes||[]).length; return `<tr><td class="nw"><b>${esc(l.numero)}</b></td><td class="nw">${dfr(l.date)}</td><td>${esc(l.client)}</td><td>${esc(l.adresse||"")}${l.chantierId?`<br><small class="t-mut">${esc(chantierLabel(l.chantierId))}</small>`:""}</td><td>${nb} ligne${nb>1?"s":""}<br><small class="t-mut">${esc((l.lignes||[]).slice(0,2).map(x=>x.des).join(", "))}${nb>2?"…":""}</small></td><td>${f?esc(f.numero):"—"}</td><td><span class="tag ${stc[l.statut]||"t-mut"}">${esc(l.statut)}</span>${l.statut==="Livré"&&l.recuPar?`<br><small class="t-mut">Reçu par ${esc(l.recuPar)}</small>`:""}${l.stockSorti?`<br><small class="t-ok">Sorti du stock</small>`:""}</td>

  }</tbody></table></div>` : emptyState("Aucun bon de livraison pour l’instant. Vous pouvez aussi en créer un depuis une facture (bouton « Livraison »).","newLivraison","Créer un bon de livraison"));

fournisseurs(){
  const rows=[...S.fournisseurs].sort((a,b)=>(a.nom||"").localeCompare(b.nom||"")).filter(f=>match(f.code,f.nom,f.contact,f.tel,f.categorie));
  const all=S.fournisseurs.map(f=>fournStats(f)); const du=all.reduce((s,x)=>s+Math.max(0,x.credit),0), att=all.reduce((s,x)=>s+x.attente,0), pay=all.reduce((s,x)=>s+x.paye,0);

  (S.fournisseurs.length?`<div class="kpis"><div class="kpi"><span>Crédit fournisseurs (à payer)</span><b class="${du>0.5?"neg":"pos"}">${money(du)}</b></div><div class="kpi"><span>Commandes pas encore livrées</span><b>${money(att)}</b></div><div class="kpi"><span>Déjà payé aux fournisseurs</span><b>${money(pay)}</b></div></div>`:"") +
  (rows.length ? `<div class="tablewrap"><table><thead><tr><th>Code</th><th>Fournisseur</th><th>Contact</th><th class="num">Livré</th><th class="num">Payé</th><th class="num">Crédit (reste dû)</th><th></th></tr></thead><tbody>${

    <td class="actions actcol">${st.credit>0.5?`<button class="btn sm primary" data-act="payerFournisseur" data-id="${f.id}">Payer</button> `:""}<button class="btn sm" data-act="releveFournisseur" data-id="${f.id}">Relevé</button> <button class="btn sm" data-act="commanderChez" data-id="${f.id}">Commander</button> <button class="btn sm" data-act="editFournisseur" data-id="${f.id}">Modifier</button> <button class="btn sm danger" data-act="delFournisseur" data-id="${f.id}">Supprimer</button></td></tr>`; }).join("")
  }</tbody></table></div>` : emptyState("Aucun fournisseur enregistré.","newFournisseur","Ajouter un fournisseur"));

encaisser(){
  const all=aEncaisser().map(x=>({...x,reste:x.total-x.paye}));
  const liees=cibles().filter(x=>x.type==="facture"&&x.contratId);
  const tot=all.reduce((s,x)=>s+conv(x.total,x.devise),0), pay=all.reduce((s,x)=>s+conv(Math.min(x.paye,x.total),x.devise),0);
  const rows=[...all,...liees.map(x=>({...x,reste:x.total-x.paye,liee:true}))].filter(x=>!encCat||x.type===encCat).filter(x=>encAll||x.reste>0.5).filter(x=>match(x.ref,x.client,x.label))
    .sort((a,b)=>(a.liee?1:0)-(b.liee?1:0)||b.reste-a.reste);
  const statut=x=> x.reste<-0.5?["Trop-perçu","t-bad"]: x.reste<=0.5?["Soldé","t-ok"]: x.paye>0?["Avance reçue","t-warn"]:["Rien payé","t-mut"];
  return head("À encaisser", "Ce que chaque client doit encore sur ses factures, contrats et tâches exécutées", searchBox("Rechercher un client")+`<button class="btn primary" data-act="newTache">Nouvelle tâche exécutée</button>`) +
  `<div class="kpis"><div class="kpi"><span>Montant total dû par les clients</span><b>${money(tot)}</b></div><div class="kpi"><span>Déjà encaissé</span><b>${money(pay)}</b></div><div class="kpi"><span>Reste à encaisser</span><b class="${tot-pay>0.5?"neg":"pos"}">${money(Math.max(0,tot-pay))}</b></div></div>
  <div class="filters"><div class="tabs" role="group" aria-label="Type" style="margin:0">${[["","Tout"],["facture","Factures"],["contrat","Contrats"],["tache","Tâches exécutées"]].map(([k,l])=>`<button data-act="encCat" data-id="${k}" aria-pressed="${encCat===k}">${l}</button>`).join("")}</div>
  <label class="check" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="encAll" ${encAll?"checked":""}> Afficher aussi les éléments soldés</label></div>` +
  (rows.length ? `<div class="tablewrap"><table class="wide"><thead><tr><th>Type</th><th>Élément</th><th>Client</th><th class="num">Montant total</th><th class="num">Déjà payé</th><th class="num">Reste à payer</th><th>Situation</th><th></th></tr></thead><tbody>${
    rows.map(x=>withCur(x.devise,()=>{const st=statut(x), pc=x.total?Math.min(100,x.paye/x.total*100):0;return `<tr><td>${TYPES_C[x.type]}</td><td><b>${esc(x.label)}</b>${x.liee?`<br><small class="t-mut">Comprise dans ${esc(contratLabel(x.contratId))}</small>`:""}${x.verseInit?`<br><small class="t-mut">dont ${money(x.verseInit)} encaissés avant les reçus</small>`:""}</td><td>${esc(x.client)}</td><td class="num">${money(x.total)}</td><td class="num" style="min-width:130px">${money(x.paye)}<div class="progress" style="margin-top:4px"><i style="width:${pc}%"></i></div></td><td class="num"><b class="${x.reste>0.5?"":"t-ok"}">${money(Math.max(0,x.reste))}</b>${x.reste<-0.5?`<br><small class="t-bad">trop-perçu ${money(-x.reste)}</small>`:""}</td><td><span class="tag ${st[1]}">${st[0]}</span></td>
    <td class="actions" style="white-space:normal;min-width:170px;line-height:2.2">${x.reste>0.5?`<button class="btn sm primary" data-act="encaisserCible" data-id="${x.type}:${x.id}">Encaisser</button> `:""}<button class="btn sm" data-act="releve" data-id="${x.type}:${x.id}">Relevé</button>${x.type==="tache"?` <button class="btn sm" data-act="editTache" data-id="${x.id}">Modifier</button> <button class="btn sm danger" data-act="delTache" data-id="${x.id}">Supprimer</button>`:""}</td></tr>`})).join("")
  }</tbody></table></div>` : `<div class="empty">${all.length||liees.length?"Rien à encaisser pour ce filtre : tout est soldé.":"Aucune facture, aucun contrat ni aucune tâche exécutée pour l’instant."}<br><button class="btn primary" data-act="newTache">Enregistrer une tâche exécutée</button></div>`);
},

/* ---------- formulaires ---------- */
function fld(name,label,val,type="text",cls=""){ return `<label class="${cls}">${label}<input name="${name}" type="${type}" value="${esc(val??"")}" ${type==="number"?'step="any"':""}></label>`; }
function sel(name,label,val,opts,cls=""){ return `<label class="${cls}">${label}<select name="${name}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val??"")?"selected":""}>${esc(l)}</option>`}).join("")}</select></label>`; }
function area(name,label,val){ return `<label class="full">${label}<textarea name="${name}">${esc(val??"")}</textarea></label>`; }
const contratOpts = (filter) => [["","— Aucun —"],...S.contrats.filter(filter||(()=>true)).map(c=>[c.id,`${c.numero} – ${c.objet||c.partie}`])];
function formData(form){ const o={}; new FormData(form).forEach((v,k)=>o[k]=typeof v==="string"?v.trim():v); return o; }

function openDialog(html, narrow){ const d=$("#dialog"); d.className="dialog"+(narrow?" narrow":""); d.innerHTML=html; $("#overlay").classList.add("open"); const f=d.querySelector("input,select,textarea"); if(f) f.focus(); }
function closeDialog(){ $("#overlay").classList.remove("open"); $("#dialog").innerHTML=""; }
$("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeDialog(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDialog(); });

function confirmBox(msg,label){ return new Promise(res=>{
  openDialog(`<h2>Confirmer</h2><p>${esc(msg)}</p><div class="dlg-actions"><button class="btn" id="cNo">Annuler</button><button class="btn primary danger" id="cYes" style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(label||"Supprimer")}</button></div>`,true);
  $("#cNo").onclick=()=>{closeDialog();res(false)}; $("#cYes").onclick=()=>{closeDialog();res(true)};
});}

function formDialog(title, body, onSave, saveLabel="Enregistrer"){
  openDialog(`<h2>${title}</h2><form class="form" id="dlgForm">${body}</form><div class="err" id="dlgErr"></div><div class="dlg-actions"><button class="btn" type="button" id="dlgCancel">Annuler</button><button class="btn primary" type="button" id="dlgSave">${saveLabel}</button></div>`);
  $("#dlgCancel").onclick=closeDialog;
  $("#dlgSave").onclick=async()=>{
    const btn=$("#dlgSave"); btn.disabled=true;
    try{ const msg=await onSave($("#dlgForm")); if(msg){ $("#dlgErr").textContent=msg; btn.disabled=false; return; } closeDialog(); render(); }
    catch(e){ $("#dlgErr").textContent = e && e.code==="quota_exceeded" ? "Espace de stockage plein : supprimez d’anciens éléments." : "Enregistrement impossible. Vérifiez votre connexion puis réessayez."; btn.disabled=false; }
  };
}

/* facture */
function factureForm(f){
  f = f || {id:uid(), numero:nextNum("FAC",S.factures), date:today(), echeance:"", client:"", clientAdresse:"", clientTel:"", tva:S.cfg.tva, remise:0, lignes:[{des:"",qte:1,pu:0}], notes:"", contratId:""};
  const lineRow = l => `<tr><td><input data-k="des" value="${esc(l.des)}" placeholder="Désignation (ex. béton dosé à 350 kg)"></td><td><input data-k="qte" type="number" step="any" value="${esc(l.qte)}" style="width:80px"></td><td><input data-k="u" value="${esc(l.u||"")}" placeholder="m³" style="width:70px"></td><td><input data-k="pu" type="number" step="any" value="${esc(l.pu)}" style="width:130px"></td><td><button class="btn sm danger" type="button" data-rm>✕</button></td></tr>`;
  formDialog(f.client?"Modifier la facture":"Nouvelle facture",
    fld("numero","Numéro",f.numero)+fld("date","Date",f.date,"date")+fld("echeance","Échéance",f.echeance,"date")+
    fld("client","Client",f.client)+fld("clientAdresse","Adresse du client",f.clientAdresse)+fld("clientTel","Téléphone du client",f.clientTel)+
    sel("contratId","Contrat lié",f.contratId,contratOpts(c=>c.type!=="soustraitance"),"full")+
    `<div class="lines"><div class="tablewrap"><table><thead><tr><th>Désignation</th><th>Qté</th><th>Unité</th><th>Prix unitaire</th><th></th></tr></thead><tbody id="lines">${(f.lignes||[]).map(lineRow).join("")}</tbody></table></div><button class="btn sm" type="button" id="addLine" style="margin-top:8px">Ajouter une ligne</button></div>`+
    sel("devise","Devise",dv(f),DEVISES)+fld("remise","Remise",f.remise,"number")+fld("tva","TVA (%)",f.tva,"number")+
    `<div class="totals" id="ftot"></div>`+area("notes","Conditions / notes",f.notes),
    async form=>{
      const d=formData(form); const lignes=[...form.querySelectorAll("#lines tr")].map(tr=>{const o={};tr.querySelectorAll("input").forEach(i=>o[i.dataset.k]=i.value.trim());return o;}).filter(l=>l.des||n(l.pu));
      if(!d.client) return "Indiquez le nom du client.";
      if(!lignes.length) return "Ajoutez au moins une ligne.";
      if(S.factures.some(x=>x.numero===d.numero&&x.id!==f.id)) return "Ce numéro de facture existe déjà.";
      await put("factures",{...f,...d,lignes,tva:n(d.tva),remise:n(d.remise)}); toast("Facture enregistrée");
    });
  const upd=()=>{ const form=$("#dlgForm"); const lignes=[...form.querySelectorAll("#lines tr")].map(tr=>({qte:tr.querySelector('[data-k="qte"]').value,pu:tr.querySelector('[data-k="pu"]').value}));
    const t=totFacture({lignes,tva:form.tva.value,remise:form.remise.value}); CUR=form.devise.value; $("#ftot").innerHTML=`Total HT ${money(t.ht)} · Remise ${money(t.remise)} · TVA ${money(t.tva)} · <b>Total TTC ${money(t.ttc)}</b>`; CUR=null; };
  $("#addLine").onclick=()=>{ $("#lines").insertAdjacentHTML("beforeend",lineRow({des:"",qte:1,pu:0})); upd(); };
  $("#dlgForm").addEventListener("input",upd);
  $("#dlgForm").addEventListener("click",e=>{ if(e.target.closest("[data-rm]")){ e.target.closest("tr").remove(); upd(); } });
  upd();
}

/* reçu */
function recuForm(r, target){
  const isNew=!r;
  const tg = target || (r && recuCible(r)) || null;
  const c0 = tg && cible(tg.type,tg.id);
  r = r || {id:uid(), numero:nextNum("REC",S.recus), date:today(), recuDe:c0?c0.client:"", montant:c0?Math.max(0,c0.total-c0.paye):"", mode:"Espèces", motif:"", reference:""};
  const oldT = isNew ? null : recuCible(r), oldM = isNew ? 0 : n(r.montant);
  const optsFor=(type,cur)=>[["","— Choisir —"],...cibles().filter(x=>x.type===type&&(x.total-x.paye>0.5||x.id===cur)).map(x=>[x.id,`${x.label} – ${x.client} (reste ${money(x.total-x.paye,x.devise)})`])];
  formDialog(isNew?"Nouveau reçu":"Modifier le reçu",
    fld("numero","Numéro",r.numero)+fld("date","Date",r.date,"date")+
    sel("cibleType","Paiement pour",tg?tg.type:"",[["","Autre encaissement"],["facture","Une facture"],["contrat","Un contrat"],["tache","Une tâche exécutée"]])+
    `<label class="full" id="cibleWrap">Élément concerné<select name="cibleId"></select></label>`+
    fld("recuDe","Reçu de",r.recuDe)+fld("montant","Montant payé",r.montant,"number")+sel("devise","Devise",dv(r),DEVISES)+`<div class="soldeinfo" id="recuSit" hidden></div>`+
    sel("mode","Mode de paiement",r.mode,MODES)+fld("reference","Référence (chèque, transaction)",r.reference)+
    fld("motif","Motif",r.motif,"text","full"),
    async form=>{
      const d=formData(form); const t=d.cibleType, id=t?d.cibleId:""; delete d.cibleType; delete d.cibleId;
      if(t && !id) return "Choisissez l’élément concerné par ce paiement.";
      if(!d.recuDe) return "Indiquez qui a payé."; if(!(n(d.montant)>0)) return "Le montant doit être supérieur à zéro.";
      if(S.recus.some(x=>x.numero===d.numero&&x.id!==r.id)) return "Ce numéro de reçu existe déjà.";
      d.devise = t ? cible(t,id).devise : (d.devise||S.cfg.devise);
      const rec={...r,...d,montant:n(d.montant),factureId:"",contratId:"",tacheId:"",totalDu:null,dejaPaye:null,resteApres:null,nature:""};
      if(t){ const x=cible(t,id); const deja=x.paye-(oldT&&oldT.type===t&&oldT.id===id?oldM:0); const apres=x.total-deja-rec.montant;
        if(apres < -0.5) return `Ce paiement dépasse le reste à payer (${money(x.total-deja,x.devise)}).`;
        rec[t+"Id"]=id; Object.assign(rec,{totalDu:x.total,dejaPaye:deja,resteApres:apres,nature:nature(apres),cibleLabel:x.label});
        if(!rec.motif) rec.motif=`${rec.nature==="Solde"?"Solde":"Avance"} – ${x.label}`; }
      await put("recus",rec); toast(rec.nature?`Reçu enregistré (${rec.nature.toLowerCase()})`:"Reçu enregistré");
    });
  const F=$("#dlgForm"), E=F.elements, wrap=$("#cibleWrap"), sit=$("#recuSit");
  const cur=()=>{ const t=E.cibleType.value, id=E.cibleId.value; return t&&id?cible(t,id):null; };
  const deja=x=> x.paye-(oldT&&oldT.type===x.type&&oldT.id===x.id?oldM:0);
  const fill=()=>{ const t=E.cibleType.value; wrap.style.display=t?"":"none"; E.cibleId.innerHTML=t?optsFor(t,tg&&tg.type===t?tg.id:"").map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join(""):""; if(tg&&tg.type===t) E.cibleId.value=tg.id; };
  const maj=()=>{ const x=cur(); E.devise.disabled=!!x; if(x) E.devise.value=x.devise; if(!x){ sit.hidden=true; return; } CUR=x.devise; const dj=deja(x), avant=x.total-dj, p=n(E.montant.value), apres=avant-p, nat=nature(apres);
    sit.hidden=false; sit.className="soldeinfo"+(apres<-0.5?" neg":"");
    sit.innerHTML=`<div class="sit"><span>Montant total</span><b>${money(x.total)}</b><span>Déjà payé</span><b>${money(dj)}</b><span>Reste avant ce paiement</span><b>${money(avant)}</b><span>Ce paiement</span><b>− ${money(p)}</b><span class="big2">Reste à payer après</span><b class="big2">${money(apres)}</b></div><p style="margin:8px 0 0">Ce paiement est ${nat==="Solde"?"<b>un solde</b> : le client ne doit plus rien.":nat==="Avance"?`<b>une avance</b> : il restera ${money(apres)} à payer.`:`<b>supérieur au reste</b> de ${money(-apres)} : réduisez le montant.`}</p>`; CUR=null; };
  E.cibleType.onchange=()=>{ fill(); onCible(); };
  const onCible=()=>{ const x=cur(); if(x){ if(!E.recuDe.value||isNew) E.recuDe.value=x.client||E.recuDe.value; if(isNew) E.montant.value=Math.max(0,x.total-deja(x)); } maj(); };
  E.cibleId.onchange=onCible; F.addEventListener("input",maj);
  fill(); maj();
}

function depenseForm(cat, d, preset){

      + sel("articleId","Matériau du stock",d.articleId||"",[["","— Hors stock (saisir la désignation) —"],...S.stock.map(a=>[a.id,`${a.nom} (${a.unite})`])])
      + fld("objet","Désignation",d.objet)
      + fld("quantite","Quantité",d.quantite??"","number")+fld("prixUnitaire","Prix unitaire",d.prixUnitaire??"","number")
      + fld("montant",`Montant total (${dvL})`,d.montant,"number")
      + `<label class="check full"><input type="checkbox" name="ajoutStock" ${d.ajoutStock===false?"":"checked"}> Ajouter cette quantité au stock</label>`
      + sel("chantierId","Livré directement au chantier",d.chantierId,chantiers);
  }else if(cat==="salaire"){
    const emps = S.employes.filter(e=>e.statut!=="Inactif"||e.id===d.employeId);
    if(!emps.length){ toast("Aucun employé actif"); return; }
    d.employeId = d.employeId || emps[0].id; d.periode = d.periode || today().slice(0,7); d.typeSalaire = d.typeSalaire || "salaire";
    if(isNew){ const e=S.employes.find(x=>x.id===d.employeId); d.base=n(e&&e.salaire); d.primes=0; d.retenues=avancesMois(d.employeId,d.periode); d.montant=Math.max(0,d.base-d.retenues); d.chantierId=d.chantierId||(e&&e.chantierId)||""; }
    body += sel("employeId","Employé",d.employeId,emps.map(e=>[e.id,`${e.nom} ${e.prenom}${e.poste?" – "+e.poste:""}`]))
      + sel("typeSalaire","Type de paiement",d.typeSalaire,[["salaire","Salaire du mois"],["avance","Avance sur salaire"]])
      + fld("periode","Mois concerné",d.periode,"month")+sel("chantierId","Chantier",d.chantierId,chantierOpts(d.chantierId))
      + fld("base","Salaire de base",d.base,"number")+fld("primes","Primes et heures sup.",d.primes??0,"number")+fld("retenues","Retenues et avances déjà versées",d.retenues??0,"number")
      + fld("montant",`Net payé (${dvL})`,d.montant,"number");
  }else if(cat==="fonctionnement"){
    body += sel("sousCategorie","Type de charge",d.sousCategorie||FONCT[0],FONCT)+fld("beneficiaire","Payé à",d.beneficiaire)+fld("objet","Détail (facultatif)",d.objet)
      + sel("chantierId","Chantier concerné (facultatif)",d.chantierId,chantiers)+fld("montant",`Montant (${dvL})`,d.montant,"number");
  }else{
    body += fld("objet","Libellé de la dépense",d.objet)+fld("beneficiaire","Payé à",d.beneficiaire)
      + sel("chantierId","Chantier concerné (facultatif)",d.chantierId,chantiers)+fld("montant",`Montant (${dvL})`,d.montant,"number");
  }
  if(cat!=="salaire") body += sel("devise","Devise du paiement",dv(d),DEVISES);
  body += sel("mode","Mode de paiement",d.mode,MODES)+fld("reference","Référence (facture fournisseur, transaction…)",d.reference)+fld("note","Note",d.note,"text","full");
  const titles = {mainoeuvre:"Paiement de main-d'œuvre",materiel:"Achat de matériel",salaire:"Paiement de salaire",fonctionnement:"Charge de fonctionnement",autre:"Autre dépense"};

  formDialog((isNew?"":"Modifier : ")+titles[cat], body, async form=>{
    const v = formData(form); const x = {...d, ...v};
    ["montant","nbJours","tauxJour","quantite","prixUnitaire","base","primes","retenues"].forEach(k=>{ if(k in v) x[k]=n(v[k]); });
    if(cat==="salaire") x.devise=S.cfg.devise; x.devise=x.devise||S.cfg.devise;
    if(S.depenses.some(o=>o.numero===x.numero&&o.id!==x.id)) return "Ce numéro de dépense existe déjà.";
    if(!(x.montant>0)) return "Le montant doit être supérieur à zéro.";
    if(cat==="mainoeuvre" && !x.beneficiaire) return "Indiquez à qui le paiement est fait.";
    if(cat==="autre" && !x.objet) return "Indiquez le libellé de la dépense.";
    if(cat==="salaire"){
      const e = S.employes.find(o=>o.id===x.employeId); if(!e) return "Choisissez un employé.";
      if(!x.periode) return "Indiquez le mois concerné.";
      if(x.typeSalaire==="salaire" && S.depenses.some(o=>o.id!==x.id&&o.categorie==="salaire"&&o.typeSalaire!=="avance"&&o.employeId===x.employeId&&o.periode===x.periode)) return `Le salaire de ${moisLabel(x.periode)} est déjà payé pour cet employé.`;
      const nom = `${e.nom} ${e.prenom||""}`.trim();
      Object.assign(x,{beneficiaire:nom, empNom:nom, empMatricule:e.matricule, empPoste:e.poste, empContrat:e.typeContrat, empEmbauche:e.dateEmbauche, chantierId:x.chantierId||""});
      if(x.typeSalaire==="avance"){ x.base=0; x.primes=0; x.retenues=0; }
    }
    if(cat==="materiel"){
      const a = S.stock.find(o=>o.id===x.articleId);
      x.ajoutStock = !!a && !!form.elements.ajoutStock.checked;
      if(!a && !x.objet) return "Choisissez un matériau du stock ou saisissez une désignation.";
      if(x.ajoutStock && !(x.quantite>0)) return "Indiquez la quantité achetée pour l'ajouter au stock.";
      x.designation = a ? a.nom : x.objet; x.unite = a ? a.unite : "";
      if(x.ajoutStock) x.chantierId = "";
      const delta = {};
      if(old && old.mouvementId && old.articleId) delta[old.articleId] = (delta[old.articleId]||0) - n(old.quantite);
      if(x.ajoutStock) delta[a.id] = (delta[a.id]||0) + x.quantite;
      for(const [id,dq] of Object.entries(delta)){ const art=S.stock.find(o=>o.id===id); if(art && n(art.quantite)+dq < 0) return `Une partie de « ${art.nom} » est déjà sortie du stock : modification impossible.`; }
      if(old && old.mouvementId) await del("mouvements", old.mouvementId);
      x.mouvementId = "";
      if(x.ajoutStock){
        const mid = uid();
        await put("mouvements",{id:mid, date:x.date, articleId:a.id, type:"entree", quantite:x.quantite, chantierId:"", note:`Achat ${x.numero}${x.beneficiaire?" – "+x.beneficiaire:""}`, depenseId:x.id, prix:conv(x.prixUnitaire,x.devise,S.cfg.devise)||n(a.prix)});
        x.mouvementId = mid;
      }
      for(const [id,dq] of Object.entries(delta)){
        const art=S.stock.find(o=>o.id===id); if(!art) continue;
        const upd={...art, quantite:n(art.quantite)+dq};
        if(x.ajoutStock && id===a.id && x.prixUnitaire>0) upd.prix = conv(x.prixUnitaire,x.devise,S.cfg.devise);
        await put("stock", upd);
      }
    }
    await put("depenses", x); toast("Dépense enregistrée");
  });

  const F = $("#dlgForm");
  const show = (name,on) => { const el=F.elements[name]; if(el) el.closest("label").style.display = on ? "" : "none"; };
  if(cat==="mainoeuvre"){
    F.addEventListener("input",e=>{ if(["nbJours","tauxJour"].includes(e.target.name) && n(F.elements.nbJours.value) && n(F.elements.tauxJour.value)) F.elements.montant.value = n(F.elements.nbJours.value)*n(F.elements.tauxJour.value); });
    F.elements.contratId.onchange=()=>{ const c=S.contrats.find(o=>o.id===F.elements.contratId.value); if(c){ if(!F.elements.beneficiaire.value) F.elements.beneficiaire.value=c.partie; if(c.contratPrincipalId){ const ch=S.chantiers.find(x=>x.contratId===c.contratPrincipalId); if(ch) F.elements.chantierId.value=ch.id; } } };
  }
  if(cat==="materiel"){
    const E = F.elements;
    const calc = () => { if(n(E.quantite.value) && n(E.prixUnitaire.value)) E.montant.value = n(E.quantite.value)*n(E.prixUnitaire.value); };
    const sync = () => { const has=!!E.articleId.value; show("objet",!has); show("ajoutStock",has); show("chantierId",!(has && E.ajoutStock.checked)); };
    E.articleId.onchange=()=>{ const a=S.stock.find(o=>o.id===E.articleId.value); if(a && !n(E.prixUnitaire.value)){ E.prixUnitaire.value=a.prix||""; calc(); } sync(); };
    F.addEventListener("input",e=>{ if(["quantite","prixUnitaire"].includes(e.target.name)) calc(); });
    E.ajoutStock.onchange=sync; sync();
  }
  if(cat==="salaire"){
    const E = F.elements;
    const calc = () => { if(E.typeSalaire.value==="salaire") E.montant.value = Math.max(0, n(E.base.value)+n(E.primes.value)-n(E.retenues.value)); };
    const sync = () => { const sal = E.typeSalaire.value==="salaire"; ["base","primes","retenues"].forEach(k=>show(k,sal)); E.montant.readOnly = sal; };
    const refill = () => { const e=S.employes.find(o=>o.id===E.employeId.value); if(e){ E.base.value=n(e.salaire); E.chantierId.value=e.chantierId||""; } E.retenues.value=avancesMois(E.employeId.value,E.periode.value); calc(); };
    E.employeId.onchange=refill; E.periode.onchange=refill;
    E.typeSalaire.onchange=()=>{ sync(); if(E.typeSalaire.value==="avance") E.montant.value=""; else calc(); };
    F.addEventListener("input",e=>{ if(["base","primes","retenues"].includes(e.target.name)) calc(); });
    sync();
  }
  const info=document.createElement("div"); info.className="soldeinfo"; info.hidden=true;
  F.elements.montant.closest("label").after(info);
  const oldOnCh = old && old.chantierId && !(old.categorie==="materiel"&&old.mouvementId) ? {id:old.chantierId, m:conv(old.montant,dv(old),S.cfg.devise)} : null;
  const majSolde=()=>{ const E=F.elements; const sel=E.chantierId; const id=sel && sel.closest("label").style.display!=="none" ? sel.value : "";
    const ch=S.chantiers.find(x=>x.id===id); if(!ch||!n(ch.budget)){ info.hidden=true; return; }
    let dispo=n(ch.budget)-coutChantier(ch.id).total; if(oldOnCh&&oldOnCh.id===ch.id) dispo+=oldOnCh.m;
    const apres=dispo-conv(n(E.montant.value),E.devise?E.devise.value:S.cfg.devise,S.cfg.devise);
    info.hidden=false; info.className="soldeinfo"+(apres<0?" neg":"");
    info.innerHTML=`Solde disponible sur ${esc(ch.code)} : <b>${money(dispo)}</b>. Après cette dépense : <b>${money(apres)}</b>${apres<0?". Le montant total du chantier sera dépassé.":"."}`; };
  F.addEventListener("input",majSolde); F.addEventListener("change",majSolde); majSolde();
}

function payerSalaires(){
  const emps = S.employes.filter(e=>e.statut!=="Inactif");
  if(!emps.length){ toast("Ajoutez d'abord vos employés"); return; }
  openDialog(`<h2>Payer les salaires du mois</h2><form class="form" id="dlgForm">${fld("periode","Mois",today().slice(0,7),"month")}${fld("date","Date de paiement",today(),"date")}${sel("mode","Mode de paiement","Espèces",MODES)}
    <div class="lines"><div class="tablewrap"><table><thead><tr><th>Payer</th><th>Employé</th><th>Base</th><th>Primes</th><th>Retenues / avances</th><th class="num">Net</th></tr></thead><tbody id="salRows"></tbody></table></div></div><div class="totals" id="salTot"></div></form>
    <div class="err" id="dlgErr"></div><div class="dlg-actions"><button class="btn" type="button" data-act="closeDlg">Annuler</button><button class="btn primary" type="button" id="salSave">Payer les salaires cochés</button></div>`);
  const F = $("#dlgForm");
  const calc = () => { let tot=0,cnt=0; F.querySelectorAll("#salRows tr[data-emp]").forEach(tr=>{ const g=k=>n(tr.querySelector(`[data-k="${k}"]`).value); const net=Math.max(0,g("base")+g("primes")-g("retenues")); tr.querySelector("[data-net]").textContent=money(net); if(tr.querySelector('[data-k="on"]').checked){ tot+=net; cnt++; } }); $("#salTot").innerHTML=`${cnt} salaire${cnt>1?"s":""} à payer · <b>Total ${money(tot)}</b>`; };
  const fill = () => { const p=F.elements.periode.value;
    $("#salRows").innerHTML = emps.map(e=>{ const paid=salairePaye(e.id,p);
      if(paid) return `<tr><td>—</td><td>${esc(e.nom)} ${esc(e.prenom)}</td><td colspan="4" class="num"><span class="tag t-ok">Déjà payé</span> ${money(paid.montant)} (${esc(paid.numero)})</td></tr>`;

    calc(); };
  F.elements.periode.onchange=fill; F.addEventListener("input",calc); F.addEventListener("change",calc);

  $("#salSave").onclick = async () => {
    const btn=$("#salSave"); const p=F.elements.periode.value;

    const rows=[...F.querySelectorAll("#salRows tr[data-emp]")].filter(tr=>tr.querySelector('[data-k="on"]').checked);
    if(!rows.length){ $("#dlgErr").textContent="Cochez au moins un employé."; return; }
    btn.disabled=true; let ok=0;

      for(const tr of rows){
        const e=S.employes.find(o=>o.id===tr.dataset.emp); if(!e || salairePaye(e.id,p)) continue;
        const g=k=>n(tr.querySelector(`[data-k="${k}"]`).value); const net=Math.max(0,g("base")+g("primes")-g("retenues")); if(net<=0) continue;
        const nom=`${e.nom} ${e.prenom||""}`.trim();
        await put("depenses",{id:uid(), numero:nextNum("DEP",S.depenses), date:F.elements.date.value||today(), categorie:"salaire", typeSalaire:"salaire", employeId:e.id, periode:p, base:g("base"), primes:g("primes"), retenues:g("retenues"), montant:net, mode:F.elements.mode.value, reference:"", note:"", objet:"", beneficiaire:nom, empNom:nom, empMatricule:e.matricule, empPoste:e.poste, empContrat:e.typeContrat, empEmbauche:e.dateEmbauche, chantierId:e.chantierId||""});
        ok++;
      }

    }catch(err){ $("#dlgErr").textContent=`Paiement interrompu après ${ok} salaire(s). Vérifiez la connexion puis réessayez : les salaires déjà payés ne seront pas repayés.`; btn.disabled=false; render(); }
  };
}

function docReleve(type,id){
  const x=cible(type,id); const recs=recusDe(type,id).sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.numero||"").localeCompare(b.numero||""));
  let reste=x.total;
  const lignes=[];
  if(x.verseInit){ reste-=x.verseInit; lignes.push(`<tr><td></td><td></td><td>Encaissé avant les reçus</td><td class="r">− ${money(x.verseInit)}</td><td class="r">${money(reste)}</td></tr>`); }
  recs.forEach(r=>{ reste-=n(r.montant); lignes.push(`<tr><td>${dfr(r.date)}</td><td>${esc(r.numero)}</td><td>${esc(r.nature||"Paiement")}${r.mode?` (${esc(r.mode)})`:""}${type==="contrat"&&r.factureId?`, facture ${esc((S.factures.find(f=>f.id===r.factureId)||{}).numero||"")}`:""}</td><td class="r">− ${money(r.montant)}</td><td class="r">${money(reste)}</td></tr>`); });

function chantierForm(ch){
  const code=()=>{ let m=0; S.chantiers.forEach(x=>{const r=/^CH-(\d+)$/.exec(x.code||""); if(r) m=Math.max(m,+r[1]);}); return "CH-"+String(m+1).padStart(3,"0"); };
  ch = ch || {id:uid(), code:code(), nom:"", lieu:"", client:"", responsable:"", contratId:"", dateDebut:today(), dateFin:"", budget:"", statut:"En cours", note:""};
  formDialog(ch.nom?"Modifier le chantier":"Nouveau chantier",
    fld("code","Code",ch.code)+fld("nom","Nom du chantier",ch.nom)+fld("lieu","Lieu / adresse",ch.lieu)+
    sel("contratId","Contrat lié (facultatif)",ch.contratId,contratOpts(c=>c.type!=="soustraitance"))+fld("client","Client / maître d'ouvrage",ch.client)+fld("responsable","Chef de chantier",ch.responsable)+
    fld("dateDebut","Date de début",ch.dateDebut,"date")+fld("dateFin","Date de fin prévue",ch.dateFin,"date")+fld("budget",`Montant total du chantier (${S.cfg.devise})`,ch.budget,"number")+
    sel("statut","Statut",ch.statut,["En préparation","En cours","Suspendu","Terminé"])+area("note","Notes",ch.note),
    async form=>{ const d=formData(form); if(!d.nom) return "Indiquez le nom du chantier."; if(S.chantiers.some(x=>x.code===d.code&&x.id!==ch.id)) return "Ce code de chantier existe déjà.";
      await put("chantiers",{...ch,...d,budget:n(d.budget)}); toast("Chantier enregistré"); });
  const E=$("#dlgForm").elements;
  E.contratId.onchange=()=>{ const c=S.contrats.find(x=>x.id===E.contratId.value); if(!c) return; if(!E.nom.value) E.nom.value=c.objet||""; if(!E.lieu.value) E.lieu.value=c.lieu||""; if(!E.client.value) E.client.value=c.partie||""; if(!n(E.budget.value)) E.budget.value=c.montant||""; };
}

function docChantier(ch){
  const deps=S.depenses.filter(d=>d.chantierId===ch.id).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const sorties=S.mouvements.filter(m=>m.chantierId===ch.id&&m.type==="sortie").sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const valM=m=>{ const a=S.stock.find(x=>x.id===m.articleId); return n(m.quantite)*n(m.prix ?? (a&&a.prix)); };
  const cats=DEP_CATS.map(([k,l])=>[l,sumB(deps.filter(d=>d.categorie===k && !(k==="materiel"&&d.mouvementId)))]).filter(x=>x[1]);
  const mat=sorties.reduce((s,m)=>s+valM(m),0);
  const tot=coutChantier(ch.id).total, b=n(ch.budget);
  const evts=[...deps.filter(d=>!(d.categorie==="materiel"&&d.mouvementId)).map(d=>({date:d.date,num:d.numero,lib:`${catLabel(d.categorie)} : ${depObjet(d)}${d.beneficiaire&&d.categorie!=="salaire"?` (${d.beneficiaire})`:""}${dv(d)!==S.cfg.devise?`, payé ${money(d.montant,dv(d))}`:""}`,m:conv(d.montant,dv(d),S.cfg.devise)})),
    ...sorties.map(m=>{ const a=S.stock.find(x=>x.id===m.articleId); return {date:m.date,num:"Stock",lib:`Sortie de stock : ${qty(m.quantite)} ${a?a.unite:""} ${a?a.nom:"(supprimé)"}`,m:valM(m)}; })]
    .sort((x,y)=>(x.date||"").localeCompare(y.date||""));
  let run=b, cum=0;
  const ledger = evts.length ? `<h4>Relevé du chantier</h4><table><thead><tr><th>Date</th><th>N°</th><th>Opération</th><th class="r">Montant</th><th class="r">${b?"Solde":"Cumul dépensé"}</th></tr></thead><tbody>
    ${b?`<tr><td>${dfr(ch.dateDebut)}</td><td></td><td><b>Montant total du chantier</b></td><td class="r"></td><td class="r"><b>${money(b)}</b></td></tr>`:""}
    ${evts.map(e=>{ run-=e.m; cum+=e.m; const v=b?run:cum; return `<tr><td>${dfr(e.date)}</td><td>${esc(e.num)}</td><td>${esc(e.lib)}</td><td class="r">− ${money(e.m)}</td><td class="r"${b&&v<0?' style="color:#B42318"':""}>${money(v)}</td></tr>`; }).join("")}
    <tr class="tot"><td colspan="4">${b?(tot>b?"Dépassement du montant total":"Solde restant"):"Total dépensé"}</td><td class="r">${money(b?b-tot:tot)}</td></tr></tbody></table>` : "";
  return `<div class="doc">${docHead("FICHE DE CHANTIER",`<b>${esc(ch.code)}</b><br>Éditée le ${dfr(today())}`)}
  <div class="box"><b>${esc(ch.nom)}</b>${ch.lieu?`<br>Lieu : ${esc(ch.lieu)}`:""}${ch.client?`<br>Client : ${esc(ch.client)}`:""}${ch.contratId?`<br>Contrat : ${esc(contratLabel(ch.contratId))}`:""}${ch.responsable?`<br>Chef de chantier : ${esc(ch.responsable)}`:""}<br>${ch.dateFin?`Du ${dfr(ch.dateDebut)} au ${dfr(ch.dateFin)}`:`Début : ${dfr(ch.dateDebut)}`}. Statut : ${esc(ch.statut)}</div>
  <h4>Résumé des coûts</h4>
  <table><tbody>${cats.map(([l,v])=>`<tr><td>${l}</td><td class="r">${money(v)}</td></tr>`).join("")}${mat?`<tr><td>Matériaux sortis du stock</td><td class="r">${money(mat)}</td></tr>`:""}
  <tr class="tot"><td>Total dépensé</td><td class="r">${money(tot)}</td></tr>${b?`<tr class="tot"><td>Montant total du chantier</td><td class="r">${money(b)}</td></tr><tr class="tot"><td>${tot>b?"Dépassement du montant total":"Solde restant"}</td><td class="r"${tot>b?' style="color:#B42318"':""}>${money(b-tot)}</td></tr>`:""}</tbody></table>
  ${ledger}
  ${!deps.length&&!sorties.length?`<p>Aucune dépense n'est encore rattachée à ce chantier.</p>`:""}
  ${docFoot()}</div>`;
}

function showDoc(build, filename){
  let L=LANG, html="";
  openDialog(`<div class="doclang" role="group" aria-label="Langue du document"><span>Langue du document</span>${LANGS.map(([k,l])=>`<button type="button" data-dl="${k}" data-notr>${l}</button>`).join("")}</div><div class="docwrap" id="docArea" data-notr></div><div class="dlg-actions"><button class="btn" id="dClose">Fermer</button>${DL?`<button class="btn" id="dDl">Télécharger</button>`:""}<button class="btn primary" id="dPrint">Imprimer</button></div>`);
  $("#dialog").style.width="min(900px,100%)";
  const draw=()=>{ html=buildDoc(build,L); const a=$("#docArea"); a.innerHTML=html; a.dir=L==="ar"?"rtl":"ltr"; a.lang=L; document.querySelectorAll("[data-dl]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.dl===L))); };
  $("#dialog").querySelector(".doclang").addEventListener("click",e=>{ const b=e.target.closest("[data-dl]"); if(b){ L=b.dataset.dl; draw(); } });
  draw();
  $("#dClose").onclick=closeDialog;
  $("#dPrint").onclick=()=>{ const z=$("#printzone"); z.innerHTML=html; z.dir=L==="ar"?"rtl":"ltr"; z.lang=L; try{ window.print(); }catch(err){ toast("Impression indisponible ici : utilisez Télécharger"); } };
  if(DL) $("#dDl").onclick=async()=>{
    const full=`<!DOCTYPE html><html lang="${L}" dir="${L==="ar"?"rtl":"ltr"}"><head><meta charset="utf-8"><title>${esc(filename)}</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Noto+Sans+Arabic:wght@400..700&display=swap" rel="stylesheet"><style>body{margin:0;background:#fff}${$("#doccss").textContent}</style></head><body>${html}<script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`;

  };

/* montants en lettres */
function enWords(x){ x=Math.floor(x); if(!x) return "zero";
  const a=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  const t=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  const h=n=>{ let s=""; if(n>=100){ s=a[Math.floor(n/100)]+" hundred"; n%=100; if(n) s+=" and "; } if(n>=20) s+=t[Math.floor(n/10)]+(n%10?"-"+a[n%10]:""); else if(n) s+=a[n]; return s; };
  const p=[]; for(const [v,name] of [[1e9,"billion"],[1e6,"million"],[1e3,"thousand"]]){ const q=Math.floor(x/v); if(q){ p.push(h(q)+" "+name); x%=v; } }
  if(x) p.push(h(x)); return p.join(" "); }
function arWords(x){ x=Math.floor(x); if(!x) return "صفر";
  const u=["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"];
  const t=["","","عشرون","ثلاثون","أربعون","خمسون","ستون","سبعون","ثمانون","تسعون"];
  const hu=["","مائة","مائتان","ثلاثمائة","أربعمائة","خمسمائة","ستمائة","سبعمائة","ثمانمائة","تسعمائة"];
  const b=n=>{ const p=[], h=Math.floor(n/100), r=n%100; if(h) p.push(hu[h]); if(r){ if(r<20) p.push(u[r]); else { const o=r%10; p.push(o? u[o]+" و"+t[Math.floor(r/10)] : t[Math.floor(r/10)]); } } return p.join(" و"); };
  const g=(q,[one,two,few,many])=> q===1?one : q===2?two : (q<=10? b(q)+" "+few : b(q)+" "+many);
  const p=[]; for(const [v,f] of [[1e9,["مليار","ملياران","مليارات","مليار"]],[1e6,["مليون","مليونان","ملايين","مليون"]],[1e3,["ألف","ألفان","آلاف","ألف"]]]){ const q=Math.floor(x/v); if(q){ p.push(g(q,f)); x%=v; } }
  if(x) p.push(b(x)); return p.join(" و"); }
const CUR_WORDS = {fr:{GNF:"francs guinéens",USD:"dollars américains",EUR:"euros",c:"centime",cs:"centimes",and:"et"},

"L’Entrepreneur s’engage à exécuter les travaux selon les règles de l’art, les plans et devis approuvés, et à respecter les règles d’hygiène et de sécurité sur le chantier. Le Maître d’ouvrage s’engage à payer le prix convenu aux échéances prévues et à faciliter l’accès au chantier.":["The Contractor undertakes to carry out the work in accordance with good practice and the approved plans and estimates, and to comply with health and safety rules on site. The Project Owner undertakes to pay the agreed price on the scheduled dates and to facilitate access to the site.","يلتزم المقاول بتنفيذ الأشغال وفق أصول المهنة والمخططات والكشوف المعتمدة، وباحترام قواعد الصحة والسلامة في الورشة. ويلتزم صاحب المشروع بدفع الثمن المتفق عليه في الآجال المحددة وبتسهيل الوصول إلى الورشة."],
"Le Sous-traitant s’engage à exécuter les travaux selon les règles de l’art, les plans et devis approuvés, et à respecter les règles d’hygiène et de sécurité sur le chantier. L’Entrepreneur principal s’engage à payer le prix convenu aux échéances prévues et à faciliter l’accès au chantier.":["The Subcontractor undertakes to carry out the work in accordance with good practice and the approved plans and estimates, and to comply with health and safety rules on site. The Main Contractor undertakes to pay the agreed price on the scheduled dates and to facilitate access to the site.","يلتزم المقاول من الباطن بتنفيذ الأشغال وفق أصول المهنة والمخططات والكشوف المعتمدة، وباحترام قواعد الصحة والسلامة في الورشة. ويلتزم المقاول الرئيسي بدفع الثمن المتفق عليه في الآجال المحددة وبتسهيل الوصول إلى الورشة."],
"En cas de retard non justifié, une pénalité pourra être appliquée selon accord écrit des parties.":["In the event of an unjustified delay, a penalty may be applied as agreed in writing by the parties.","في حالة التأخير غير المبرر، يمكن تطبيق غرامة وفق اتفاق مكتوب بين الطرفين."],
"À l’achèvement, une réception provisoire sera prononcée contradictoirement, suivie d’une réception définitive à l’issue de la période de garantie convenue.":["On completion, provisional acceptance will be declared jointly, followed by final acceptance at the end of the agreed guarantee period.","عند الإنجاز، يتم الاستلام المؤقت بحضور الطرفين، يليه الاستلام النهائي عند انتهاء فترة الضمان المتفق عليها."],
"En cas de manquement grave de l’une des parties à ses obligations, l’autre partie pourra résilier le présent contrat après mise en demeure restée sans effet pendant quinze (15) jours.":["If either party seriously breaches its obligations, the other party may terminate this contract after a formal notice has gone unanswered for fifteen (15) days.","في حالة إخلال أحد الطرفين إخلالاً جسيماً بالتزاماته، يجوز للطرف الآخر فسخ هذا العقد بعد إنذار يبقى دون جدوى لمدة خمسة عشر (15) يوماً."],
"Tout différend sera d’abord réglé à l’amiable. À défaut, il sera porté devant la juridiction compétente du lieu d’exécution des travaux.":["Any dispute will first be settled amicably. Failing that, it will be brought before the competent court of the place where the work is performed.","يُسوّى كل نزاع ودياً في المقام الأول، وإلا يُرفع أمام المحكمة المختصة في مكان تنفيذ الأشغال."],

[/^N°ENTREPRISE\/RCCM\/(.+)$/, "Company No./RCCM/$1", "رقم المؤسسة/السجل التجاري/$1"],[/^NIFp : (.+)$/, "Tax ID (NIFp): $1", "الرقم الضريبي (NIFp): $1"],[/^- (construction et transport logistique)$/, "- construction and transport logistics", "- البناء والنقل واللوجستيك"],

];
PAT.unshift([/^TVA ([\d.,]+) %$/, "VAT $1%", "الضريبة $1%"],[/^(.+), payé (.+) sur (.+)$/, "$1, paid $2 of $3", "$1، دفع $2 من أصل $3"]);
const SEPS = [" · ", " – ", " : "];
function trKey(s,L){ const e=I18N[s]; return e ? e[L==="en"?0:1] : null; }
function trCore(s,L,depth){
  const k=trKey(s,L); if(k!=null) return k;
  if(depth>3) return s;
  for(const [re,en,ar] of PAT.slice(0,-1)){ const m=s.match(re); if(m) return applyPat(m,L==="en"?en:(ar??en),L,depth); }
  if(/\s:$/.test(s)){ const c=s.replace(/\s:$/,""); const t=trCore(c,L,depth+1); if(t!==c||trKey(c,L)!=null) return t+":"; }
  if(/^:\s/.test(s)){ const c=s.slice(2); const t=trCore(c,L,depth+1); if(t!==c) return ": "+t; }
  for(const sep of SEPS){ if(s.includes(sep)){ const parts=s.split(sep); const tp=parts.map(p=>p?trCore(p,L,depth+1):p); if(tp.some((t,i)=>t!==parts[i])||(sep===" : "&&trKey(parts[0],L)!=null)) return tp.join(sep===" : "?": ":sep); } }
  let m;
  if((m=s.match(/^(.+?) ([−-]?\s?-?[\d\s  .,]+ (?:GNF|USD|EUR))$/))){ const t=trCore(m[1],L,depth+1); if(t!==m[1]) return t+" "+m[2]; }
  if((m=s.match(/^(.+) \((GNF|USD|EUR)\)$/))){ const t=trCore(m[1],L,depth+1); if(t!==m[1]) return `${t} (${m[2]})`; }
  if((m=s.match(/^(.+?) \((.+)\)$/))){ const a=trCore(m[1],L,depth+1), b=trCore(m[2],L,depth+1); if(a!==m[1]||b!==m[2]) return `${a} (${b})`; }
  const last=PAT[PAT.length-1]; if((m=s.match(last[0]))) return applyPat(m,L==="en"?last[1]:last[2],L,depth);
  return s;
}
function applyPat(m,tpl,L,depth){ if(typeof tpl==="function") return tpl(m,L); return tpl.replace(/\$(\d)/g,(_,i)=>{ const g=m[+i]||""; return trCore(g,L,depth+1); }); }
function tr(text,L){ L=L||LANG; if(L==="fr"||!text) return text; const mm=text.match(/^(\s*)([\s\S]*?)(\s*)$/); const core=mm[2].replace(/\s+/g," "); if(!core||!/[A-Za-zÀ-ÿ]/.test(core)) return text; const t=trCore(core,L,0); return t===core? text : mm[1]+t+mm[3]; }
function translateTree(root,L){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); const list=[]; let nd; while((nd=w.nextNode())) list.push(nd);
  list.forEach(t=>{ if(t.parentElement&&t.parentElement.closest("script,style")) return; const v=tr(t.nodeValue,L); if(v!==t.nodeValue) t.nodeValue=v; });
  root.querySelectorAll && root.querySelectorAll("[placeholder],[aria-label],[alt]").forEach(e=>["placeholder","aria-label","alt"].forEach(a=>{ const v=e.getAttribute(a); if(v){ const t=tr(v,L); if(t!==v) e.setAttribute(a,t);} }));
}
function translateHTML(html,L){ if(L==="fr") return html; const d=document.createElement("div"); d.innerHTML=html; translateTree(d,L); return d.innerHTML; }

/* traduction en direct de l'interface */
const ORIG=new WeakMap(), LAST=new WeakMap();
function skipNode(nd){ const p=nd.parentElement; return !p || !!p.closest("script,style,[data-notr]"); }
function trNode(nd){ if(skipNode(nd)) return;
  if(LAST.has(nd) && nd.nodeValue===LAST.get(nd)){ const t=tr(ORIG.get(nd),LANG); if(t!==nd.nodeValue){ nd.nodeValue=t; LAST.set(nd,t); } return; }
  const o=nd.nodeValue, t=tr(o,LANG); if(t!==o){ ORIG.set(nd,o); LAST.set(nd,t); nd.nodeValue=t; } }
function trAttrs(el){ if(el.closest("[data-notr]")) return; ["placeholder","aria-label","alt"].forEach(a=>{ if(!el.hasAttribute(a)) return; const ok="data-o-"+a; if(!el.hasAttribute(ok)) el.setAttribute(ok,el.getAttribute(a)); const t=tr(el.getAttribute(ok),LANG); if(el.getAttribute(a)!==t) el.setAttribute(a,t); }); }
function trTree(root){ if(root.nodeType===3){ trNode(root); return; } if(root.nodeType!==1) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let nd; const l=[]; while((nd=w.nextNode())) l.push(nd); l.forEach(trNode);
  [root,...root.querySelectorAll("[placeholder],[aria-label],[alt]")].forEach(e=>e.getAttribute&&trAttrs(e)); }
let trBusy=false;
new MutationObserver(muts=>{ if(trBusy) return; trBusy=true; try{ muts.forEach(m=>{ if(m.type==="characterData") trNode(m.target); else m.addedNodes.forEach(trTree); }); } finally { trBusy=false; } })
  .observe(document.body,{childList:true,subtree:true,characterData:true});
function applyLang(){ document.documentElement.lang=LANG; document.documentElement.dir = LANG==="ar"?"rtl":"ltr";
  document.querySelectorAll("#langsw button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===LANG)));
  trBusy=true; try{ trTree(document.body); } finally { trBusy=false; } }
function setLang(l){ LANG=l; try{ localStorage.setItem("sonab-lang",l); }catch(e){} render(); applyLang(); }
document.getElementById("langsw").innerHTML = LANGS.map(([k,l,s])=>`<button type="button" data-lang="${k}" title="${l}" aria-label="${l}">${s}</button>`).join("");
document.getElementById("langsw").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang); });
applyLang();

init();
